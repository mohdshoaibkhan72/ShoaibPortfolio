<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem("theme");
          if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          d.setAttribute("data-theme", t);
        } catch (e) { d.setAttribute("data-theme", "dark"); }
        // First visit this session → the loading screen will play. Cover the prerendered page
        // until it appears, so it doesn't flash first (mirrors src/lib/intro.js).
        try {
          if (!matchMedia("(prefers-reduced-motion: reduce)").matches && !sessionStorage.getItem("intro-played")) {
            d.setAttribute("data-intro", "");
          }
        } catch (e) { d.setAttribute("data-intro", ""); }
      })();
    </script>

    <!-- Page-specific SEO tags (title, description, canonical, Open Graph, JSON-LD) are inserted below from src/seo/meta.js -->
    <!--seo-head-->

    <meta name="author" content="Mohammad Shoaib Khan" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-title" content="Shoaib Khan" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@300..800&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
